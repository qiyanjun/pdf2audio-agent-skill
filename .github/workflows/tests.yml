name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install ffmpeg (packaging tests) and a word list (lint's fused-word check)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg wamerican
      - name: Run tests (the voice smoke test skips here; the model is a 350 MB download)
        run: python -m unittest discover -s tests -v
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Validate the plugin (frontmatter, manifests, file references, scripts)
        run: python3 tests/validate_plugin.py
